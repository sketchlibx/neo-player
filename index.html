<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <meta name="description" content="Neo Stream Player">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/css/player.css" as="style">
  <link rel="stylesheet" href="/css/player.css">
  <title>Neo Stream Player</title>
</head>
<body>
  <main class="page-shell">
    <section class="source-panel" aria-label="Video source">
      <div class="source-row">
        <label class="source-input-wrap">
          <span class="source-icon" aria-hidden="true">↗</span>
          <input id="sourceInput" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                 placeholder="Paste a direct video, JSON, player URL, or source-page URL…">
        </label>
        <button id="loadButton" class="load-btn" type="button">Load</button>
      </div>
      <div id="sourceStatus" class="source-status" role="status" aria-live="polite"></div>
    </section>

    <section id="player" class="player-shell" aria-label="Video player"></section>
  </main>

  <script src="/js/player.js"></script>
  <script>
    window.NeoPlayerApp.init({
      mount: document.getElementById('player'),
      input: document.getElementById('sourceInput'),
      loadButton: document.getElementById('loadButton'),
      status: document.getElementById('sourceStatus'),
      autoplay: true
    });

    const params = new URLSearchParams(location.search);
    const initial = params.get('url') || params.get('source') || params.get('src');
    if (initial) {
      document.getElementById('sourceInput').value = initial;
      document.getElementById('loadButton').click();
    }
  </script>
</body>
</html>
